# Configuration for Diffusion Policy training (1D U-Net, low-dim state)
# Used by: 09_train_lowdim_unet.py

# ---------------------------------------------------------------
# Temporal parameters
# ---------------------------------------------------------------
horizon: 16              # Total prediction horizon (future timesteps)
n_obs_steps: 2           # Number of observation steps as context
n_action_steps: 8        # Number of actions to execute per planning step

# ---------------------------------------------------------------
# Diffusion parameters
# ---------------------------------------------------------------
num_diffusion_iters: 100          # DDPM training timesteps
num_inference_iters: 16           # Denoising steps at inference (can be << train)
beta_schedule: squaredcos_cap_v2  # Noise schedule

# ---------------------------------------------------------------
# 1D U-Net architecture
# ---------------------------------------------------------------
down_dims: [256, 512, 1024]    # Channel dims at each U-Net level (~15M params)
kernel_size: 3
n_groups: 8                    # GroupNorm groups
diffusion_step_embed_dim: 256  # Sinusoidal timestep embedding dim
cond_predict_scale: true       # FiLM conditioning (scale + bias)

# ---------------------------------------------------------------
# Training parameters
# ---------------------------------------------------------------
epochs: 500
batch_size: 64
learning_rate: 0.0001
weight_decay: 0.000001
ema_decay: 0.995               # Exponential moving average for model weights
lr_warmup_steps: 500           # Linear warmup before cosine decay
grad_clip_norm: 1.0            # Gradient clipping

# ---------------------------------------------------------------
# Checkpoint saving
# ---------------------------------------------------------------
checkpoint_dir: /tmp/cabinet_diffusion_checkpoints

